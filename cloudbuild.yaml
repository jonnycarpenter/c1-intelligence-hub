# Cloud Build configuration for C1 Intelligence Hub
# Triggers on push to main branch (via GitHub trigger)
#
# MANUAL DEPLOY (always use --region=us-central1):
#   gcloud builds submit --config=cloudbuild.yaml --region=us-central1 --project=gen-lang-client-0436975498
#
# GitHub trigger should be configured in GCP Console with region=us-central1

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile.prod'
      - '.'
    dir: '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '80'
      - '--execution-environment'
      - 'gen2'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--startup-probe'
      - 'httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=5,timeoutSeconds=5,failureThreshold=36'
      - '--add-volume'
      - 'name=data-volume,type=cloud-storage,bucket=${_DATA_BUCKET}'
      - '--add-volume-mount'
      - 'volume=data-volume,mount-path=/app/data'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,API_NINJA_KEY=api-ninja-key:latest,TAVILY_API_KEY=tavily-api-key:latest,FMP_API_KEY=FMP_API_KEY:latest,SEC_IO_KEY=SEC_IO_KEY:latest,IMPORTYETI_API_KEY=importyeti-api-key:latest,APOLLO_API_KEY=APOLLO_API_KEY:latest,EXA_API_KEY=EXA_API_KEY:latest,LOGO_DEV_TOKEN=LOGO_DEV_TOKEN:latest,STOCKNEWS_API_KEY=STOCKNEWS_API_KEY:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,ASSEMBLYAI_API_KEY=ASSEMBLYAI_API_KEY:latest'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,GCP_PROJECT_ID=${PROJECT_ID},GCP_DATASET_ID=c1_intelligence,GCS_BUCKET_NAME=${_DATA_BUCKET},KNOWLEDGE_PERSIST_DIR=/app/data/knowledge_db,SITE_ACCESS_PASSWORD=${_SITE_PASSWORD}'

# Substitution variables (can be overridden via --substitutions flag)
substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'c1-intelligence-hub'
  _SITE_PASSWORD: 'ketzero'
  _SERVICE_NAME: 'c1-hub'
  _DATA_BUCKET: 'gen-lang-client-0436975498-c1-hub-data'
  _TAG: 'latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Store images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'

# Timeout for entire build
timeout: '1800s'
